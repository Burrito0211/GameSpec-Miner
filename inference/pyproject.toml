[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulelens"
version = "0.1.0"
description = "Infer game rules from gameplay traces and generate a human-readable spec"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "jsonschema",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "types-jsonschema"]

[project.scripts]
rulelens = "rulelens.cli:app"

[tool.setuptools.packages.find]
include = ["rulelens*"]

[tool.setuptools.package-data]
rulelens = ["io/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
